<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Every Half — Asset Gallery</title>
  <style>
    :root{--ink:#151210;--paper:#f4efea;--rust:#c85a32;--gold:#e69d45}*{box-sizing:border-box}body{background:var(--paper);color:var(--ink);font-family:system-ui,sans-serif;margin:0}header{background:var(--ink);color:var(--paper);padding:clamp(2rem,7vw,6rem)}h1{font:clamp(2.5rem,7vw,6rem)/.9 Georgia,serif;margin:.5rem 0}header p{max-width:60ch}.notice{color:#ffd09d;font-size:.85rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase}.grid{display:grid;gap:1rem;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));padding:clamp(1.25rem,5vw,5rem)}figure{background:white;margin:0;min-width:0}button{background:none;border:0;cursor:zoom-in;display:block;padding:0;width:100%}img{aspect-ratio:1/1;display:block;object-fit:cover;width:100%}figcaption{padding:1rem}figcaption strong{display:block}figcaption small{color:#675e59;display:block;margin-top:.35rem;overflow-wrap:anywhere}.wide img{aspect-ratio:16/9}.modal{align-items:center;background:rgba(21,18,16,.94);display:none;inset:0;justify-content:center;padding:2rem;position:fixed;z-index:3}.modal.open{display:flex}.modal img{aspect-ratio:auto;max-height:90vh;max-width:94vw;object-fit:contain;width:auto}.modal button{color:white;font-size:2rem;position:absolute;right:1rem;top:1rem;width:auto}@media(max-width:600px){.grid{grid-template-columns:1fr 1fr;padding:1rem}figcaption{font-size:.8rem}}
  </style>
</head>
<body>
  <header><p class="notice">Bài tập học thuật – không phải trang chính thức của thương hiệu</p><h1>Every Half<br>Asset Gallery</h1><p>23 visual assets generated for the “Living Journey” academic landing-page prototype. Click any asset to inspect it.</p></header>
  <main class="grid" id="gallery"></main><div class="modal" id="modal" role="dialog" aria-modal="true" aria-label="Image preview"><button type="button" aria-label="Đóng ảnh">×</button><img alt=""></div>
  <script>
    const assets=[
      ['Hero master','public/images/everyhalf/hero/01_hero_master.png'],['Hero foreground','public/images/everyhalf/hero/02_hero_foreground.png'],['Hero macro','public/images/everyhalf/hero/03_hero_macro.png'],['Becoming / seed','public/images/everyhalf/becoming/04a_becoming_seed.png'],['Becoming / germination','public/images/everyhalf/becoming/04b_becoming_germination.png'],['Becoming / growth','public/images/everyhalf/becoming/04c_becoming_growth.png'],['Becoming / flower','public/images/everyhalf/becoming/04d_becoming_flower.png'],['Becoming / fruit','public/images/everyhalf/becoming/04e_becoming_fruit.png'],['Origin / human','public/images/everyhalf/origin/05_origin_human.png'],['Origin / soil','public/images/everyhalf/origin/06_origin_soil.png'],['Process','public/images/everyhalf/process/07_process.png'],['Roast heat','public/images/everyhalf/process/08_roast_heat.png'],['Coffee object','public/images/everyhalf/product/09_coffee_object.png'],['Product world','public/images/everyhalf/product/10_product_world.png'],['Human moment','public/images/everyhalf/people/11_human_moment.png','wide'],['Space','public/images/everyhalf/space/12_space.png','wide'],['Transition macro','public/images/everyhalf/transition/13_transition_macro.png','wide'],['Organic / leaf','public/images/everyhalf/organic/14_organic_01.png'],['Organic / cherries','public/images/everyhalf/organic/14_organic_02.png'],['Organic / flower','public/images/everyhalf/organic/14_organic_03.png'],['Organic / branch','public/images/everyhalf/organic/14_organic_04.png'],['Material texture','public/images/everyhalf/texture/15_material_texture.png'],['Closing','public/images/everyhalf/closing/16_closing.png','wide']
    ];
    const grid=document.querySelector('#gallery'),modal=document.querySelector('#modal'),modalImage=modal.querySelector('img');
    assets.forEach(([name,path,size])=>{const figure=document.createElement('figure');figure.className=size||'';figure.innerHTML=`<button type="button" aria-label="Mở ${name}"><img src="${path}" alt="${name}"></button><figcaption><strong>${name}</strong><small>${path}</small></figcaption>`;figure.querySelector('button').onclick=()=>{modalImage.src=path;modalImage.alt=name;modal.classList.add('open')};grid.append(figure)});
    modal.onclick=(event)=>{if(event.target===modal||event.target.tagName==='BUTTON')modal.classList.remove('open')};
  </script>
</body>
</html>
